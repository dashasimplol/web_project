<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кулинарная книга</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./dist/main.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>Кулинарная книга</h1>
    <p>Лабораторная работа по TypeScript</p>
  </header>
  <main>
    <section aria-labelledby="search-title">
      <h2 id="search-title">Найти рецепт</h2>
      
      <label for="search">Название рецепта</label>
      <input id="search" type="search" placeholder="Введите название...">
      
      <label for="category-filter">Категория</label>
      <select id="category-filter">
        <option value="Все">Все категории</option>
        <option value="Завтрак">Завтрак</option>
        <option value="Обед">Обед</option>
        <option value="Ужин">Ужин</option>
        <option value="Десерт">Десерт</option>
      </select>

      <div style="margin-top: 12px; display: flex; gap: 15px; flex-wrap: wrap;">
        <label style="margin: 0;">
          <input id="favorites-only" type="checkbox"> Только избранное
        </label>
        <label style="margin: 0;">
          <input id="fast-only" type="checkbox"> Быстрые (до 30 мин)
        </label>
      </div>

      <label for="sort-by">Сортировка по времени приготовления</label>
      <select id="sort-by">
        <option value="none">Без сортировки</option>
        <option value="asc">Сначала быстрые</option>
        <option value="desc">Сначала долгие</option>
      </select>

      <button id="clear-filters-btn" type="button" style="margin-top: 15px; background: #cfd8dc; color: #263238; border: none; border-radius: 8px; cursor: pointer;">Очистить фильтры</button>
    </section>

    <section aria-labelledby="form-section-title">
      <h2 id="form-section-title" class="form-mode-title">Добавить рецепт</h2>
      <form id="recipe-form">
        <input type="hidden" id="edit-recipe-id" name="id">

        <label for="recipe-title">Название блюда</label>
        <input id="recipe-title" name="title" required maxlength="80">

        <label for="recipe-category">Категория</label>
        <select id="recipe-category" name="category" required>
          <option value="Завтрак">Завтрак</option>
          <option value="Обед">Обед</option>
          <option value="Ужин">Ужин</option>
          <option value="Десерт">Десерт</option>
        </select>

        <label for="recipe-servings">Количество порций</label>
        <input id="recipe-servings" name="servings" type="number" min="1" max="30" value="2" required>

        <label for="recipe-time">Время приготовления (мин.)</label>
        <input id="recipe-time" name="cookingTime" type="number" min="1" max="600" value="20" required>

        <label for="recipe-image">Ссылка на изображение (URL)</label>
        <input id="recipe-image" name="imageUrl" type="url" placeholder="ммм">

        <label for="recipe-ingredients">Ингредиенты (через запятую)</label>
        <textarea id="recipe-ingredients" name="ingredients" required placeholder="Творог, яйцо, мука..."></textarea>

        <label for="recipe-instructions">Инструкция по приготовлению</label>
        <textarea id="recipe-instructions" name="instructions" required></textarea>

        <button type="submit" id="form-submit-btn">Сохранить рецепт</button>
        <button type="button" id="cancel-edit-btn" style="display: none; background: #e0e0e0; color: #333; margin-left: 10px;">Отмена</button>
        <p id="form-message" role="status" style="margin-top: 10px; font-weight: bold;"></p>
      </form>
    </section>

    <section aria-labelledby="recipes-list-title">
      <h2 id="recipes-list-title">Список рецептов</h2>
      <p id="results-count" aria-live="polite" style="font-weight: bold; color: #555;"></p>
      <div id="recipe-list" class="recipe-grid"></div>
    </section>
  </main>
</body>
</html>
